name: Sentient-NAS-Bridge Sync

on:
  schedule:
    # 每天凌晨 4 点运行（SentientOS 凌晨 3 点跑完）
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - "workbuddy/**"
      - "scripts/**"
      - "config/**"

jobs:
  sync:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      
      - name: Install dependencies
        run: pip install pyyaml requests
      
      - name: Generate context injection
        run: |
          python workbuddy/memory_bridge.py
      
      - name: Commit and push knowledge updates
        run: |
          git config user.name "Sentient-NAS-Bridge[bot]"
          git config user.email "bot@sentient-nas-bridge.dev"
          git add knowledge/ workbuddy/
          git diff --staged --quiet || git commit -m "sync: daily knowledge update $(date +%Y-%m-%d)"
          git push
